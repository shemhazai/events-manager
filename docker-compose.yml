# Pile locale complète : PostgreSQL, API, nginx. Le déploiement sur le NAS est une autre
# unité ; rien ici n'est destiné à la production.
#
# Première séquence de lancement (détaillée dans CLAUDE.md) :
#   docker compose up -d db
#   docker compose run --rm migrate
#   application du seed dans le conteneur db
#   docker compose up -d
#
# Deux formes de $ cohabitent dans ce fichier, et la différence est porteuse :
#   ${VAR} est interpolé PAR COMPOSE, depuis .env, à la lecture de ce fichier
#   $$VAR  n'est pas touché par compose et reste évalué DANS le conteneur

services:
  db:
    # La même image que la fixture Testcontainers des tests d'intégration
    # (tests/IntegrationTests/PostgreSqlContainerFixture.cs) : un seul PostgreSQL dans le dépôt,
    # donc un seul comportement à connaître.
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Lié à la loopback, et sur le port standard : le décalage 14330 de la pile SQL Server
      # n'évitait qu'une collision avec l'instance SQL Server locale du poste, motif éteint.
      # Publier reste utile pour psql/pgAdmin depuis l'hôte et pour lancer l'API au F5 contre
      # ce conteneur ; le seed, lui, n'en a pas besoin (il passe par docker compose exec).
      - "127.0.0.1:5432:5432"
    volumes:
      # /var/lib/postgresql ET NON /var/lib/postgresql/data : depuis la 18, l'image place PGDATA
      # dans /var/lib/postgresql/18/docker et déclare son VOLUME sur le parent. Monter .../data
      # ici ne persisterait RIEN — la pile tournerait, et la ligne du seed disparaîtrait au
      # premier « down ». Sur une image 17 ou antérieure, c'est exactement l'inverse.
      - db-data:/var/lib/postgresql
      - ./db/seed:/seed:ro
    healthcheck:
      # -h localhost force le TCP, et ce n'est pas décoratif : sans -h, pg_isready passe par la
      # socket Unix, que le serveur TEMPORAIRE de l'initialisation écoute déjà (l'entrypoint le
      # démarre avec « -c listen_addresses='' »). Le service serait donc « healthy » avant que
      # le TCP n'écoute, et migrate partirait trop tôt.
      # $$POSTGRES_USER : les variables sont lues DANS le conteneur, pas interpolées ici.
      test: ["CMD-SHELL", "pg_isready -h localhost -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Service outil, rangé dans un profil : « docker compose up » ne le démarre jamais. Migrer
  # reste un geste explicite — docker compose run --rm migrate — et l'API n'exécute aucun DDL.
  migrate:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
      target: migrate
    profiles: [tools]
    depends_on:
      db:
        condition: service_healthy
    # --connection remplace la chaîne de dev codée en dur dans la factory design-time. Sur un
    # serveur vierge, le bundle crée la base puis applique les migrations.
    command:
      - --connection
      - Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}

  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    # ASPNETCORE_ENVIRONMENT reste à son défaut, Production, délibérément : MapOpenApi() n'est
    # câblé qu'en Development, et appsettings.Development.json porte une chaîne sans mot de
    # passe, qui vise le poste et non un conteneur.
    environment:
      ConnectionStrings__EventsManager: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    # AUCUN port publié : nginx est le seul point d'entrée de la pile.

  web:
    build:
      context: ./web
      target: runtime
    # service_started et non service_healthy : l'API n'a pas de healthcheck, il n'y a pas de
    # GET /health dans cette unité. Ce depends_on n'est pas décoratif pour autant — nginx résout
    # « api » au chargement de sa configuration et refuserait de démarrer sans le conteneur.
    # Conséquence assumée : un 502 est possible le temps que l'API se mette à écouter.
    depends_on:
      api:
        condition: service_started
    ports:
      - "8080:80"

volumes:
  db-data:
