<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html{color-scheme:light dark}body{margin:0}</style>
<title>Harnais events-manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
  :root {
    --ground: #FCFAFA;
    --surface: #FFFFFF;
    --sunk: #F2ECEB;
    --ink: #241C1B;
    --soft: #6B5F5D;
    --faint: #948785;
    --rule: #E6DEDC;
    --accent: #B0413E;
    --steady: #3D6B57;

    --display: "Archivo", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0B0B0C;
      --surface: #141416;
      --sunk: #1C1C1F;
      --ink: #F4F4F5;
      --soft: #A9A9AE;
      --faint: #78787E;
      --rule: #2A2A2E;
      --accent: #FF7A72;
      --steady: #6ED3A6;
    }
  }

  :root[data-theme="dark"] {
    --ground: #0B0B0C;
    --surface: #141416;
    --sunk: #1C1C1F;
    --ink: #F4F4F5;
    --soft: #A9A9AE;
    --faint: #78787E;
    --rule: #2A2A2E;
    --accent: #FF7A72;
    --steady: #6ED3A6;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--display);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 1080px;
    margin: 0 auto;
    padding: 44px 20px 72px;
  }

  h1 {
    font-size: clamp(30px, 5vw, 44px);
    font-weight: 800;
    letter-spacing: -0.026em;
    line-height: 1.05;
    margin: 0 0 8px;
  }

  .sub {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--soft);
    margin: 0 0 36px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--rule);
  }

  figure { margin: 0; overflow-x: auto; }

  svg {
    display: block;
    width: 100%;
    min-width: 860px;
    height: auto;
    color: var(--ink);
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 26px;
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 12px;
    color: var(--soft);
  }

  .legend span { white-space: nowrap; }
  .legend b { color: var(--ink); font-weight: 500; }
  .legend .ret { color: var(--accent); }
</style>

</head>
<body>
<div class="page">

  <h1>Harnais events-manager</h1>
  <p class="sub">Qui prépare, qui exécute, qui est invoqué, et par où ça revient.</p>

  <figure>
    <svg viewBox="0 0 1030 880" role="img" aria-label="Jarvis produit la mission, collée en argument de la commande cadrage. Le fil de l'agent principal descend en colonne : contexte, cadrage, plan, code, check, commit. Les sous-agents, les MCP et la skill sont décalés à droite, atteints par une flèche aller et rendant par une flèche retour. Quatre retours ferment les boucles.">
      <defs>
        <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"></path>
        </marker>
        <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"></path>
        </marker>
      </defs>

      <!-- ============ JARVIS ============ -->
      <text x="20" y="22" font-family="Archivo, sans-serif" font-size="17" font-weight="800" fill="currentColor">JARVIS</text>
      <text x="98" y="22" font-family="JetBrains Mono, monospace" font-size="11.5" fill="var(--faint)">préparation</text>

      <rect x="20" y="36" width="250" height="300" fill="var(--sunk)" stroke="var(--rule)" stroke-width="1"></rect>

      <rect x="40" y="60" width="210" height="46" fill="var(--surface)" stroke="currentColor" stroke-width="1.2"></rect>
      <text x="54" y="80" font-family="JetBrains Mono, monospace" font-size="12" fill="currentColor">CONTEXT.md</text>
      <text x="54" y="96" font-family="JetBrains Mono, monospace" font-size="12" fill="currentColor">HISTORY.md</text>

      <rect x="40" y="118" width="210" height="30" fill="var(--surface)" stroke="currentColor" stroke-width="1.2"></rect>
      <text x="54" y="138" font-family="JetBrains Mono, monospace" font-size="12" fill="currentColor">ROADMAP-agentic.md</text>

      <text x="40" y="178" font-family="Archivo, sans-serif" font-size="12.5" font-weight="700" fill="var(--soft)">PRODUIT</text>

      <rect x="40" y="190" width="210" height="30" fill="none" stroke="var(--accent)" stroke-width="1.4"></rect>
      <text x="54" y="210" font-family="JetBrains Mono, monospace" font-size="12" fill="var(--accent)">la mission</text>

      <text x="40" y="250" font-family="JetBrains Mono, monospace" font-size="11" fill="var(--faint)">Ne touche jamais au</text>
      <text x="40" y="266" font-family="JetBrains Mono, monospace" font-size="11" fill="var(--faint)">code. Les règles métier</text>
      <text x="40" y="282" font-family="JetBrains Mono, monospace" font-size="11" fill="var(--faint)">ne sont pas ici : elles</text>
      <text x="40" y="298" font-family="JetBrains Mono, monospace" font-size="11" fill="var(--faint)">sortent du cadrage.</text>

      <!-- mission -> /cadrage -->
      <path d="M 270 205 L 318 205 L 318 127 L 396 127" fill="none" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#aa)"></path>

      <!-- ============ CLAUDE CODE ============ -->
      <text x="356" y="22" font-family="Archivo, sans-serif" font-size="17" font-weight="800" fill="currentColor">CLAUDE CODE</text>
      <text x="512" y="22" font-family="JetBrains Mono, monospace" font-size="11.5" fill="var(--faint)">dans events-manager</text>

      <rect x="336" y="36" width="674" height="804" fill="none" stroke="var(--rule)" stroke-width="1"></rect>

      <line x1="380" y1="75" x2="380" y2="751" stroke="currentColor" stroke-width="2"></line>

      <!-- ===== 1 : contexte ===== -->
      <text x="348" y="79" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--faint)">1</text>
      <line x1="380" y1="75" x2="400" y2="75" stroke="currentColor" stroke-width="1.4"></line>
      <rect x="400" y="56" width="360" height="38" fill="var(--surface)" stroke="currentColor" stroke-width="1.2"></rect>
      <text x="416" y="80" font-family="JetBrains Mono, monospace" font-size="12.5" fill="currentColor">CLAUDE.md + web/CLAUDE.md</text>
      <text x="615" y="80" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--faint)">se charge seul</text>
      <rect x="856" y="64" width="94" height="22" fill="none" stroke="var(--rule)" stroke-width="1"></rect>
      <text x="903" y="79" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--soft)">fichier</text>

      <!-- phase A -->
      <text x="400" y="108" font-family="Archivo, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="var(--faint)">OUVRIR LA TRANCHE, UNE FOIS</text>

      <!-- ===== 2 : /cadrage ===== -->
      <text x="348" y="145" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--faint)">2</text>
      <line x1="380" y1="133" x2="400" y2="133" stroke="currentColor" stroke-width="1.4"></line>
      <rect x="400" y="114" width="360" height="54" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.6"></rect>
      <text x="416" y="136" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="700" fill="var(--accent)">/cadrage</text>
      <text x="490" y="136" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--faint)">la mission collée en argument</text>
      <text x="416" y="156" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--faint)">il te pose les questions métier, tu réponds</text>
      <rect x="856" y="130" width="94" height="22" fill="none" stroke="var(--accent)" stroke-width="1"></rect>
      <text x="903" y="145" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--accent)">command</text>

      <!-- ===== 3 : acceptance-writer ===== -->
      <text x="348" y="215" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--faint)">3</text>
      <line x1="380" y1="204" x2="456" y2="204" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#aa)"></line>
      <line x1="460" y1="228" x2="384" y2="228" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#aa)"></line>
      <rect x="460" y="188" width="380" height="54" fill="var(--sunk)" stroke="var(--accent)" stroke-width="1.4"></rect>
      <text x="476" y="210" font-family="JetBrains Mono, monospace" font-size="12.5" fill="var(--accent)">acceptance-writer</text>
      <text x="476" y="230" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--faint)">écrit docs/acceptance/, l'oracle. Rien d'autre.</text>
      <rect x="856" y="204" width="94" height="22" fill="none" stroke="var(--accent)" stroke-width="1"></rect>
      <text x="903" y="219" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--accent)">agent</text>

      <!-- phase B -->
      <text x="400" y="256" font-family="Archivo, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="var(--faint)">PUIS À CHAQUE TÂCHE</text>

      <!-- ===== 4 : plan ===== -->
      <text x="348" y="285" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--faint)">4</text>
      <line x1="380" y1="281" x2="400" y2="281" stroke="currentColor" stroke-width="1.4"></line>
      <rect x="400" y="262" width="360" height="38" fill="var(--surface)" stroke="currentColor" stroke-width="1.2"></rect>
      <text x="416" y="286" font-family="JetBrains Mono, monospace" font-size="12.5" fill="currentColor">plan proposé</text>
      <rect x="856" y="270" width="94" height="22" fill="none" stroke="var(--rule)" stroke-width="1"></rect>
      <text x="903" y="285" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--soft)">tu valides</text>

      <!-- ===== 5 : MCP ===== -->
      <text x="348" y="347" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--faint)">5</text>
      <line x1="380" y1="336" x2="456" y2="336" stroke="var(--steady)" stroke-width="1.4" marker-end="url(#a)"></line>
      <line x1="460" y1="360" x2="384" y2="360" stroke="var(--steady)" stroke-width="1.4" marker-end="url(#a)"></line>
      <rect x="460" y="320" width="380" height="54" fill="var(--sunk)" stroke="var(--steady)" stroke-width="1.4"></rect>
      <text x="476" y="342" font-family="JetBrains Mono, monospace" font-size="12.5" fill="var(--steady)">microsoft-learn · context7 · angular-cli</text>
      <text x="476" y="362" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--faint)">la doc first-party avant de générer</text>
      <rect x="856" y="336" width="94" height="22" fill="none" stroke="var(--steady)" stroke-width="1"></rect>
      <text x="903" y="351" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--steady)">MCP</text>

      <!-- ===== 6 : design-ui ===== -->
      <text x="348" y="421" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--faint)">6</text>
      <line x1="380" y1="410" x2="456" y2="410" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#aa)"></line>
      <line x1="460" y1="434" x2="384" y2="434" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#aa)"></line>
      <rect x="460" y="394" width="380" height="54" fill="var(--sunk)" stroke="var(--accent)" stroke-width="1.4"></rect>
      <text x="476" y="416" font-family="JetBrains Mono, monospace" font-size="12.5" fill="var(--accent)">design-ui</text>
      <text x="476" y="436" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--faint)">si la tâche touche web/</text>
      <rect x="856" y="410" width="94" height="22" fill="none" stroke="var(--accent)" stroke-width="1"></rect>
      <text x="903" y="425" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--accent)">skill</text>

      <!-- ===== 7 : test-writer ===== -->
      <text x="348" y="495" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--faint)">7</text>
      <line x1="380" y1="484" x2="456" y2="484" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#aa)"></line>
      <line x1="460" y1="508" x2="384" y2="508" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#aa)"></line>
      <rect x="460" y="468" width="380" height="54" fill="var(--sunk)" stroke="var(--accent)" stroke-width="1.4"></rect>
      <text x="476" y="490" font-family="JetBrains Mono, monospace" font-size="12.5" fill="var(--accent)">test-writer</text>
      <text x="570" y="490" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--faint)">écrit sous tests/, jamais src/</text>
      <text x="476" y="510" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--faint)">lit docs/acceptance/, jamais le corps des méthodes</text>
      <rect x="856" y="484" width="94" height="22" fill="none" stroke="var(--accent)" stroke-width="1"></rect>
      <text x="903" y="499" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--accent)">agent</text>

      <!-- ===== 8 : le code ===== -->
      <text x="348" y="565" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--faint)">8</text>
      <line x1="380" y1="561" x2="400" y2="561" stroke="currentColor" stroke-width="1.4"></line>
      <rect x="400" y="542" width="360" height="38" fill="var(--surface)" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="416" y="566" font-family="JetBrains Mono, monospace" font-size="12.5" fill="currentColor">l'agent principal écrit le code</text>
      <rect x="856" y="550" width="94" height="22" fill="none" stroke="var(--rule)" stroke-width="1"></rect>
      <text x="903" y="565" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--soft)">src/ web/</text>

      <!-- ===== 9 : /check ===== -->
      <text x="348" y="623" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--faint)">9</text>
      <line x1="380" y1="619" x2="400" y2="619" stroke="currentColor" stroke-width="1.4"></line>
      <rect x="400" y="600" width="360" height="38" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.6"></rect>
      <text x="416" y="624" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="700" fill="var(--accent)">/check</text>
      <text x="475" y="624" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--faint)">jusqu'au vert, 3 passes max</text>
      <rect x="856" y="608" width="94" height="22" fill="none" stroke="var(--accent)" stroke-width="1"></rect>
      <text x="903" y="623" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--accent)">command</text>

      <!-- ===== 10 : reviewer ===== -->
      <text x="348" y="685" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--faint)">10</text>
      <line x1="380" y1="674" x2="456" y2="674" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#aa)"></line>
      <line x1="460" y1="698" x2="384" y2="698" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#aa)"></line>

      <text x="476" y="700" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--faint)">rend un verdict, ne corrige jamais</text>
      <rect x="856" y="674" width="94" height="22" fill="none" stroke="var(--accent)" stroke-width="1"></rect>
      <text x="903" y="689" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--accent)">agent</text>

      <!-- ===== 11 : commit ===== -->
      <text x="348" y="755" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--faint)">11</text>
      <line x1="380" y1="751" x2="400" y2="751" stroke="currentColor" stroke-width="1.4"></line>
      <rect x="400" y="732" width="360" height="38" fill="var(--surface)" stroke="currentColor" stroke-width="1.2"></rect>
      <text x="416" y="756" font-family="JetBrains Mono, monospace" font-size="12.5" fill="currentColor">commit</text>
      <text x="475" y="756" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--faint)">sur ta demande, jamais spontané</text>
      <rect x="856" y="740" width="94" height="22" fill="none" stroke="var(--rule)" stroke-width="1"></rect>
      <text x="903" y="755" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--soft)">local</text>

      <!-- ===== RETOURS ===== -->
      <path d="M 700 638 L 700 650 L 978 650 L 978 528 L 700 528 L 700 538" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#aa)"></path>
      <path d="M 700 712 L 700 724 L 978 724 L 978 650" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="5 3"></path>
      <text x="712" y="646" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--accent)">rouge</text>
      <text x="712" y="720" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--accent)">bloquant</text>
      <text x="972" y="592" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--accent)">on corrige la cause, jamais le symptôme</text>

      <path d="M 460 516 L 300 516 L 300 155 L 396 155" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#aa)"></path>
      <text x="296" y="540" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--accent)">critère incomplet :</text>
      <text x="296" y="553" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--accent)">il s'arrête, on retourne</text>
      <text x="296" y="566" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--accent)">au cadrage</text>

      <path d="M 540 770 L 540 828 L 145 828 L 145 342" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#aa)"></path>
      <text x="552" y="822" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--accent)">ce que l'unité a appris remonte au contexte et au roadmap</text>
    </svg>
  </figure>

  <div class="legend">
    <span><b>colonne de gauche</b> ce que l'agent principal fait lui-même</span>
    <span><b>blocs décalés</b> ce qu'il invoque : il envoie, il récupère, il continue</span>
    <span><b>MCP · skill · agent · command</b> le type de la brique</span>
    <span class="ret"><b>tirets</b> les retours</span>
  </div>

</div>
</body>
</html>
