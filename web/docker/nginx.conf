server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;

  # Relais vers l'API. Le front et l'API sont servis par la même origine : aucun CORS.
  #
  # PAS DE BARRE FINALE APRÈS LE PORT, et ce n'est pas un détail de style. proxy_pass sans URI
  # transmet l'URI de la requête telle que le client l'a envoyée, donc /api/events/current arrive
  # intact. Avec « http://api:8080/ », nginx remplacerait la partie qui matche la location (/api/)
  # par « / » et l'API recevrait /events/current, qui n'existe pas.
  #
  # Le service api n'est pas joignable depuis l'hôte : ce bloc est le seul chemin vers l'API.
  # nginx résout « api » au chargement de la configuration, pas à chaque requête (il faudrait des
  # variables et un resolver pour cela) : si le conteneur api n'existe pas encore, nginx refuse de
  # démarrer sur un « host not found in upstream ». D'où le depends_on du compose.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fichiers produits avec une empreinte par `outputHashing: all`.
  # Guillemets obligatoires : sans eux nginx interprète les accolades du regex.
  location ~* "-[A-Za-z0-9]{8}\.(?:js|css|woff2?)$" {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
